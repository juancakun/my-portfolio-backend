<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <section id="projects" th:fragment="projects">
        <h2>MIS PROYECTOS</h2>
        <div class="projects-grid">
            <div class="project-card" th:each="project : ${projectsList}">
                <img th:src="@{${project.imageUrl}}" alt="Placeholder Project Image">
                <h3 th:text="${project.title}">Proyecto</h3>
                <p th:text="${project.description}">Descripción breve del proyecto.</p>
                <a th:href="${project.projectUrl}">Ver proyecto</a>
            </div>
        </div>
    </section>

</body>
</html>
