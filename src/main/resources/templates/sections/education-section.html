<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education</title>
</head>
<body>
    <section id="education" th:fragment="education">
        <h2>MI FORMACIÓN</h2>
        <div class="education-timeline">
            <div class="timeline-item" th:each="education : ${educationList}">
                <h3 th:text="${education.degree} + ' - ' + ${education.institution}"></h3>
                <p class="timeline-date" th:text="${education.startDate} + ' - ' + ${education.endDate}"></p>
                <p th:text="${education.description}"></p>
            </div>
        </div>
    </section>
</body>
</html>
