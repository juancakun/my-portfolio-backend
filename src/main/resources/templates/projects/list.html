<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Proyectos</title>
    <link rel="stylesheet" href="/css/general.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/style-form-project.css">
    <link rel="stylesheet" href="/css/style-list.css">
</head>
<body>

<header>
    <div class="container">
        <div th:insert="~{fragments/nav-admin :: nav-admin}" ></div>
    </div>
</header>


    <main>
        <div class="container">
            <section class="admin-section">
                <h2>Lista de Proyectos guardados</h2>
                <a th:href="@{/projects/new-project}">Crear nuevo proyecto</a>
                <table class="admin-table">
                    <thead>
                    <tr>
                        <th>Título</th>
                        <th>Descripción</th>
                        <th>URL del Proyecto</th>
                        <th>Imagen</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="project : ${projects}">
                        <td th:text="${project.title}"></td>
                        <td th:text="${project.description}"></td>
                        <td th:text="${project.projectUrl}"></td>
                        <td>
                            <img th:src="@{${project.imageUrl}}" width="150" height="150" alt="Imagen del Proyecto">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
